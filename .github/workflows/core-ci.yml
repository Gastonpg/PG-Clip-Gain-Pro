name: Core and VST3 CI

on:
  push:
    branches:
      - design/pg-audio-intelligence-foundation

jobs:
  build-test-and-plugin:
    name: Build, test and VST3 (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure Windows x64
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DPGCLIP_BUILD_TESTS=ON -DPGCLIP_BUILD_VST3=ON

      - name: Build all configured targets
        run: cmake --build build --config Release --parallel 2

      - name: Run core tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Windows VST3 bundle
        run: cmake -E copy_directory build/VST3/Release/PGClipGainPro.vst3 artifact/PGClipGainPro.vst3

      - name: Upload Windows VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: PG-Clip-Gain-Pro-VST3-Windows
          path: artifact/PGClipGainPro.vst3
          if-no-files-found: error
          retention-days: 14
