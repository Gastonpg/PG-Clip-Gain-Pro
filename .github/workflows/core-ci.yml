name: Core and VST3 CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - design/pg-audio-intelligence-foundation
  pull_request:
    branches:
      - main

jobs:
  build-test-and-plugin:
    name: Build, test and VST3 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPGCLIP_BUILD_TESTS=ON -DPGCLIP_BUILD_VST3=ON

      - name: Build core and VST3
        run: cmake --build build --config Release --target PGClipGainPro pgclip_core_tests pgclip_fixture_tests pgclip_capture_tests pgclip_window_tests pgclip_snapshot_tests pgclip_context_tests pgclip_spsc_queue_tests --parallel 2

      - name: Run core tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: PG-Clip-Gain-Pro-VST3-${{ matrix.os }}
          path: build/**/*.vst3
          if-no-files-found: error
          retention-days: 14
