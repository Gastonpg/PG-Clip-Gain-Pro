version: 0.1.{build}

image: Visual Studio 2022
platform: x64
configuration: Release

branches:
  only:
    - pre-judges/core-completion-roadmap

skip_tags: true
clone_depth: 1

build_script:
  - cmd: cmake --version
  - cmd: cmake -S . -B build -A x64 -DPGCLIP_BUILD_TESTS=ON -DPGCLIP_BUILD_VST3=ON
  - cmd: cmake --build build --config Release --parallel 2

test_script:
  - ps: |
      $reportPath = Join-Path $env:APPVEYOR_BUILD_FOLDER "build\ctest-results.xml"
      ctest --test-dir build -C Release --output-on-failure --output-junit "$reportPath"
      $testExitCode = $LASTEXITCODE

      if (Test-Path $reportPath) {
          if ([string]::IsNullOrWhiteSpace($env:APPVEYOR_JOB_ID)) {
              Write-Host "APPVEYOR_JOB_ID is unavailable; JUnit report was generated at $reportPath"
          } else {
              (New-Object 'System.Net.WebClient').UploadFile("https://ci.appveyor.com/api/testresults/junit/$($env:APPVEYOR_JOB_ID)", $reportPath)
          }
      } else {
          Write-Host "CTest did not generate the JUnit report. Check the CTest output above."
      }

      if ($testExitCode -ne 0) {
          throw "CTest failed with exit code $testExitCode"
      }

artifacts:
  - path: build\VST3\Release\PGClipGainPro.vst3
    name: PG-Clip-Gain-Pro-VST3-Windows
    type: zip
